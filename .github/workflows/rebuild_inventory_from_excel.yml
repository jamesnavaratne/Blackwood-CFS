name: Rebuild inventory and offline metadata

on:
  workflow_dispatch:
  push:
    paths:
      - 'Blackwood_CFS_Master_Inventory.xlsx'
      - 'tools/rebuild_inventory_from_excel.py'
      - 'photos/**'
      - 'directions/index.html'
      - 'directions/maps/ubd/**'
      - 'manifest.json'
      - 'icon.png'
      - 'icons/**'

permissions:
  contents: write

jobs:
  rebuild-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild inventory and offline metadata
        run: python tools/rebuild_inventory_from_excel.py

      - name: Check for generated changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit rebuilt app files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/inventory.json content-metadata.json offline-assets.json
          git commit -m "Auto-rebuild inventory and offline metadata"
          git push
