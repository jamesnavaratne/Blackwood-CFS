name: Validate Blackwood Admin proposal

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'admin/submissions/**'
      - 'admin/processed/**'
      - 'Blackwood_CFS_Master_Inventory.xlsx'
      - 'data/inventory.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workbook and generated app without mutating files
        run: python tools/rebuild_inventory_from_excel.py --check-only
