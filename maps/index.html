<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=10,user-scalable=yes"><meta name="theme-color" content="#0b1422"><title>Maps · Blackwood CFS</title>
<style>
:root{color-scheme:dark;--bg:#080f1c;--panel:#101d2d;--panel2:#15263d;--line:#243953;--text:#eaf3ff;--muted:#a3b4c8;--blue:#56adff;--navh:76px;--headerh:64px;--side:305px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #67b6ff;outline-offset:2px}
header{height:var(--headerh);display:flex;align-items:center;gap:12px;background:#0b1728;border-bottom:1px solid var(--line);padding:9px 16px;position:relative;z-index:11}
.mark{width:4px;height:39px;background:#377fbb;border-radius:4px}.brand{min-width:0;flex:1}.brand small{color:#69b6fa;font-weight:850;font-size:10px;letter-spacing:.13em}.brand h1{margin:1px 0 0;font-weight:850;font-size:20px;letter-spacing:-.03em}.home{display:flex;align-items:center;justify-content:center;width:43px;height:43px;border:1px solid #2c435e;background:#101c2d;border-radius:12px;color:var(--text);text-decoration:none}
.main{height:calc(100dvh - var(--headerh) - var(--navh) - env(safe-area-inset-bottom));display:flex;min-height:0}
.sidebar{width:var(--side);flex:none;background:#0d1c2d;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidebarhead{padding:16px 14px 12px;border-bottom:1px solid var(--line)}.sidebarhead h2{font-size:17px;margin:0 0 4px}.subtitle{margin:0;color:var(--muted);font-size:12px}.count{font-size:11px;color:#8dbde8}.mapsearch{width:100%;border:1px solid #304a6a;color:white;background:#0b1829;border-radius:10px;padding:11px;margin-top:14px}.list{overflow-y:auto;overscroll-behavior:contain;flex:1;padding:10px 8px 18px}.group{color:#78afdf;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:850;margin:16px 11px 6px}.list button{border:1px solid transparent;width:100%;text-align:left;display:flex;align-items:center;gap:9px;background:transparent;border-radius:9px;padding:11px;color:#dce8f5;font-size:12px;font-weight:700}.list button:hover{background:#192d45}.list button.selected{background:#1b3b5b;border-color:#337db4;color:#fff}.list button .mini{opacity:.7;white-space:nowrap;margin-left:auto;font-size:10px;font-weight:600}
.viewer{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;background:#0a1421}
.viewerbar{display:flex;align-items:center;gap:9px;flex:none;border-bottom:1px solid var(--line);padding:8px 11px;background:#102038;min-height:57px;z-index:3}.view-title{font-weight:800;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.view-title small{display:block;font-weight:600;color:#a6bdd4;font-size:10px}.controls{display:flex;gap:6px;align-items:center}.control{min-width:37px;height:35px;border:1px solid #3a5572;border-radius:9px;background:#1c3857;color:#eff6ff;font-size:18px;font-weight:750;padding:0 10px}.control.subtle{background:#152d46;font-size:12px}.scale{font-size:11px;min-width:45px;text-align:center;color:#c8d6e5}
.mobilepicker{display:none;width:100%;background:#132a44;border:1px solid #426184;border-radius:9px;padding:9px 32px 9px 10px;color:#f5f9ff;font-weight:700;text-overflow:ellipsis}
#viewport{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain;scrollbar-color:#3a5c7c #102033;touch-action:pan-x pan-y;position:relative}
#center{min-height:100%;min-width:100%;display:flex;justify-content:center;align-items:flex-start}#stack{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:14px 14px 55px;transform-origin:top center;flex:none}
.page{background:#edf0f3;color:#273849;box-shadow:0 4px 22px #0009;position:relative;display:block;max-width:none}.page img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.page-tag{position:absolute;left:9px;top:9px;background:#10233adc;color:#fff;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:800;pointer-events:none}
.empty{padding:80px 22px;text-align:center;color:#b2c7da}.loading{padding:16px;color:#a7c8e8}.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#11243be8;border:1px solid #345271;color:#d7eaf7;padding:7px 12px;border-radius:99px;font-size:11px;z-index:2;white-space:nowrap;pointer-events:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--navh) + env(safe-area-inset-bottom));padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border-top:1px solid #1e3148;background:#0a101adf;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}nav a{border-radius:13px;min-height:54px;color:#aabaca;text-decoration:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-weight:850;font-size:11px;white-space:nowrap}nav a.active{background:#123b5b;color:#55b9ff}nav svg{height:21px;width:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:800px){:root{--headerh:60px;--navh:73px}.sidebar{display:none}.mobilepicker{display:block}.viewerbar{flex-wrap:wrap;min-height:106px;gap:7px;padding:7px 9px}.pickwrap{width:100%}.view-title{flex:1;order:1;font-size:12px}.controls{order:2;margin-left:auto}.hint{bottom:7px;font-size:10px;padding:5px 8px}nav a{font-size:10px}#stack{padding:8px 7px 40px;gap:8px}}
@media(max-width:400px){.brand h1{font-size:18px}.view-title small{display:none}.controls{gap:4px}.control{min-width:32px;padding:0 7px;height:34px}.scale{min-width:37px}.hint{max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}}
</style></head>
<body>
<header><span class="mark"></span><div class="brand"><small>BLACKWOOD CFS</small><h1>Maps</h1></div><a class="home" href="../index.html" aria-label="Return to system home" title="System home"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v9H3zM9 20v-8h6v8"/></svg></a></header>
<div class="main"><aside class="sidebar"><div class="sidebarhead"><h2>Operational maps</h2><p class="subtitle">UBD, response maps &amp; reserve plans</p><input id="search" class="mapsearch" placeholder="Search maps…" aria-label="Search maps"/><div class="count" id="count"></div></div><div class="list" id="list"></div></aside>
<section class="viewer" aria-label="Scrollable map viewer"><div class="viewerbar"><div class="pickwrap"><select id="picker" class="mobilepicker" aria-label="Choose map"></select></div><div class="view-title" id="currentTitle">Maps<small>Choose a map to begin</small></div><div class="controls"><button class="control" id="minus" title="Zoom out" aria-label="Zoom out">−</button><span id="scale" class="scale">100%</span><button class="control" id="plus" title="Zoom in" aria-label="Zoom in">+</button><button class="control subtle" id="fit" title="Fit to width">Fit</button></div></div><div id="viewport" tabindex="0" aria-label="Map pages. Scroll to move through pages; use zoom controls or pinch to zoom."><div id="center"><div id="stack"><div class="empty">Select a map</div></div></div></div><div class="hint" id="hint">Scroll pages · drag/scroll to explore · pinch to zoom</div></section></div>
<nav aria-label="Primary"><a href="../index.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M8 5V3h8v2M8 10h8M8 14h5"/></svg><span>Inventory</span></a><a href="../directions/index.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M8 15v-4a3 3 0 0 1 3-3h5m-3-3 3 3-3 3"/></svg><span>Directions Book</span></a><a class="active" href="index.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 6.5 9 4l6 2.5L20 4v13.5L15 20l-6-2.5L4 20zM9 4v13.5M15 6.5V20"/></svg><span>Maps</span></a><a href="../hydrants/index.html"><svg viewBox="0 0 24 24"><path d="M8 20v-8a4 4 0 0 1 8 0v8M6 20h12M7 9h10M10 5h4M12 5V2M5 13H3v4h2M19 13h2v4h-2"/></svg><span>Hydrants</span></a></nav>
<script src="maps-data.js"></script>
<script>
(()=>{'use strict';
const maps=window.BLACKWOOD_MAP_LIST||[];const $=id=>document.getElementById(id);
const pane=$('viewport'),stack=$('stack'),picker=$('picker'),list=$('list'),title=$('currentTitle');
const KEY='blackwood-maps-viewer-v1';let stored={};try{stored=JSON.parse(sessionStorage.getItem(KEY)||'{}')||{}}catch{}
let selected=Math.min(Math.max(Number(stored.selected)||0,0),maps.length-1),zoom=Number(stored.zoom)||1,loadToken=0,position=stored.positions||{};
const saved=()=>{try{sessionStorage.setItem(KEY,JSON.stringify({selected,zoom,positions:position}))}catch{}};
let pageWidth=1000,baseW=1000,baseH=700;
function fitWidth(){return Math.max(240,pane.clientWidth-(matchMedia('(max-width:800px)').matches?14:28))}
function mapKey(){return String(selected)}
function savePosition(){if(!maps.length)return;let top=pane.scrollTop,left=pane.scrollLeft;position[mapKey()]={top,left,zoom};saved()}
function updateSize(keepCenter=false){if(!maps.length)return;let px=pane.scrollLeft+pane.clientWidth/2,py=pane.scrollTop+pane.clientHeight/2,old=pageWidth||1;pageWidth=fitWidth()*zoom;stack.style.width=pageWidth+'px';$('scale').textContent=Math.round(zoom*100)+'%';if(keepCenter){let ratio=pageWidth/old;requestAnimationFrame(()=>{pane.scrollLeft=Math.max(0,px*ratio-pane.clientWidth/2);pane.scrollTop=Math.max(0,py*ratio-pane.clientHeight/2);savePosition()})}}
function setZoom(next){zoom=Math.min(7.5,Math.max(.55,next));updateSize(true);saved()}
function renderList(term=''){list.replaceChildren();let last='',count=0;maps.forEach((m,i)=>{if(!m.title.toLowerCase().includes(term.toLowerCase()))return;count++;if(m.kind!==last){let cap=document.createElement('div');cap.className='group';cap.textContent=m.kind;list.appendChild(cap);last=m.kind}let btn=document.createElement('button');btn.className=i===selected?'selected':'';btn.type='button';let name=document.createElement('span');name.textContent=m.title;btn.appendChild(name);let mini=document.createElement('span');mini.className='mini';mini.textContent=m.pages.length>1?m.pages.length+' pages':'';btn.appendChild(mini);btn.onclick=()=>openMap(i);list.appendChild(btn)});$('count').textContent=count+' of '+maps.length+' maps'}
function renderPicker(){picker.replaceChildren();maps.forEach((m,i)=>{let op=document.createElement('option');op.value=i;op.textContent=m.title;picker.appendChild(op)});picker.value=String(selected)}
function openMap(i,restore=false){if(!maps[i])return;const previous=selected;if(!restore)savePosition();selected=i;zoom=restore?(Number(stored.zoom)||1):(position[mapKey()]?.zoom||1);title.replaceChildren();title.append(document.createTextNode(maps[i].title));let sub=document.createElement('small');sub.textContent=maps[i].kind+(maps[i].pages.length>1?' · '+maps[i].pages.length+' continuous pages':'');title.appendChild(sub);let token=++loadToken;stack.replaceChildren();const pages=maps[i].pages;let loaded=0;
 pages.forEach((src,index)=>{const box=document.createElement('div');box.className='page';const img=document.createElement('img');img.loading=index<2?'eager':'lazy';img.decoding='async';img.alt=maps[i].title+' — page '+(index+1);const dims=maps[i].dimensions?.[index];if(dims){img.width=dims[0];img.height=dims[1];}img.draggable=false;img.src=src;img.addEventListener('load',()=>{loaded++;if(token!==loadToken)return;img.style.aspectRatio='auto';if(index===0){const ratio=img.naturalHeight/img.naturalWidth;if(Number.isFinite(ratio)&&ratio>0.1){baseH=ratio*fitWidth(); updateSize()}}});img.addEventListener('error',()=>{img.alt='Image missing: '+src;box.style.minHeight='120px';box.textContent='Unable to load map image: '+src});box.appendChild(img);if(pages.length>1){const tag=document.createElement('span');tag.className='page-tag';tag.textContent='Page '+(index+1)+' / '+pages.length;box.appendChild(tag)}stack.appendChild(box)});
 updateSize();renderPicker();renderList($('search').value);saved();const old=position[mapKey()];requestAnimationFrame(()=>{pane.scrollTop=old?.top||0;pane.scrollLeft=old?.left||0})}
$('search').addEventListener('input',e=>renderList(e.target.value));picker.addEventListener('change',e=>openMap(+e.target.value));$('plus').onclick=()=>setZoom(zoom*1.3);$('minus').onclick=()=>setZoom(zoom/1.3);$('fit').onclick=()=>setZoom(1);
pane.addEventListener('scroll',()=>{clearTimeout(pane._saveDebounce);pane._saveDebounce=setTimeout(savePosition,110)},{passive:true});window.addEventListener('pagehide',savePosition);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePosition()});
let oldW=pane.clientWidth;window.addEventListener('resize',()=>{if(Math.abs(pane.clientWidth-oldW)>1){oldW=pane.clientWidth;updateSize(true)}});
// Ctrl + wheel zoom on desktops; ordinary wheel scrolls through document pages.
pane.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom*(e.deltaY>0?.91:1.1))},{passive:false});
// Mouse drag pans the zoomed map like Hydrants; a normal vertical wheel scrolls all pages.
let dragging=null;pane.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||zoom<=1.03)return;dragging={x:e.clientX,y:e.clientY,left:pane.scrollLeft,top:pane.scrollTop};pane.setPointerCapture(e.pointerId)});
pane.addEventListener('pointermove',e=>{if(!dragging)return;pane.scrollLeft=dragging.left-(e.clientX-dragging.x);pane.scrollTop=dragging.top-(e.clientY-dragging.y)});pane.addEventListener('pointerup',()=>{dragging=null});pane.addEventListener('pointercancel',()=>{dragging=null});
// Native two-finger pinch on mobile. The browser also supports viewport pinch zoom.
let pinch=null;const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
pane.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch={distance:distance(e.touches),zoom}},{passive:true});
pane.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();setZoom(pinch.zoom*distance(e.touches)/pinch.distance)}},{passive:false});pane.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null},{passive:true});
renderPicker();openMap(selected,true);
})();
</script></body></html>
