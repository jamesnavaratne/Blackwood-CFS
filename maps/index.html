<script>
(()=>{'use strict';
const maps=window.BLACKWOOD_MAP_LIST||[];const $=id=>document.getElementById(id);

 }else if(singleStart&&Math.hypot(t.clientX-singleStart.x,t.clientY-singleStart.y)>12) singleStart.moved=true;
},{passive:false});
pane.addEventListener('touchend',e=>{
 if(e.touches.length<2)pinch=null;
 if(e.touches.length)return;
